name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Soarscore.sln

      - name: Build
        run: dotnet build Soarscore.sln --configuration Release --no-restore

      - name: Emit seed corpus JSON
        run: dotnet run --project tools/Soarscore.SeedData --configuration Release --no-build

      - name: Test
        run: dotnet test Soarscore.sln --configuration Release --no-build

  deploy:
    name: Deploy app
    needs: build-and-test
    if: github.event_name == 'push'    # never deploy from pull_request runs
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Emit seed corpus JSON
        run: dotnet run --project tools/Soarscore.SeedData --configuration Release
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_IO_DEPLOY_TOKEN }}
